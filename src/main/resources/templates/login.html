<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Vacaciones - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos-grammer.css}">
</head>
<body class="body-login">

<div class="login-container">
    <div class="login-card">

        <div class="brand-icon">
            <i class="bi bi-shield-lock"></i>
        </div>

        <div class="text-center mb-4">
            <h4 class="fw-bold text-dark mb-1" style="letter-spacing: -0.5px;">Administrador Incidencias Grammer</h4>
            <p class="text-muted small">Módulo de Autenticación</p>
        </div>

        <div th:if="${error}" class="alert alert-danger d-flex align-items-center mb-4 shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <span th:text="${error}">Error general</span>
        </div>

        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center mb-4 shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
            <span>Sesión cerrada correctamente en el servidor.</span>
        </div>

        <form th:action="@{/login}" method="POST">

            <div class="mb-3">
                <label for="nomina" class="form-label-login text-uppercase fw-bold mb-2">Número de Nómina</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                    <input type="text" class="form-control" id="nomina" name="nomina"
                           placeholder="Ej. 14450" required autocomplete="off">
                </div>
            </div>

            <div class="mb-4">
                <label for="tag" class="form-label-login text-uppercase fw-bold mb-2">TAG / Credencial</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-upc-scan"></i></span>
                    <input type="password" class="form-control" id="tag" name="tag"
                           placeholder="Ingresa el TAG de tu credencial" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 text-white shadow-sm d-flex align-items-center justify-content-center gap-2">
                <span>Ingresar al Portal</span>
                <i class="bi bi-arrow-right-short fs-4"></i>
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
