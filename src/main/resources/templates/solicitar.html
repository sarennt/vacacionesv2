<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{solicitar.titulo} + ' - ' + #{portal.personal}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/material_blue.css">

    <link rel="stylesheet" th:href="@{/css/estilos-grammer.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: menuPlanta}"></div>

<div style="height: 80px;"></div>

<div class="modal fade" id="modalComercial" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 1rem;">
            <div class="modal-header bg-warning border-0 text-dark">
                <h5 class="modal-title fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="#{solicitar.modal.aviso.titulo}"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center p-4">
                <i class="bi bi-calendar-x text-warning mb-3" style="font-size: 4rem;"></i>
                <h5 class="fw-bold" th:text="#{solicitar.modal.aviso.subtitulo}"></h5>
                <p class="text-muted" th:text="#{solicitar.modal.aviso.desc}"></p>
                <div class="bg-light p-3 rounded-3 mt-3">
                    <p class="mb-0 fw-bold text-dark small" th:text="#{solicitar.modal.aviso.nota}"></p>
                </div>
            </div>
            <div class="modal-footer border-0 bg-light justify-content-center">
                <button type="button" class="btn btn-secondary px-4 shadow-sm" data-bs-dismiss="modal" th:text="#{boton.regresar}"></button>
                <button type="button" class="btn text-dark btn-warning px-4 shadow-sm fw-bold" id="btnAceptarComercial" th:text="#{boton.aceptar.enviar}"></button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalError" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 1rem;">
            <div class="modal-header bg-danger border-0 text-white">
                <h5 class="modal-title fw-bold"><i class="bi bi-x-octagon-fill me-2"></i><span th:text="#{solicitar.modal.error.titulo}"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center p-4">
                <i class="bi bi-calendar-x-fill text-danger mb-3" style="font-size: 4rem;"></i>
                <h5 class="fw-bold text-dark" th:text="#{solicitar.modal.error.subtitulo}"></h5>
                <p class="text-muted mt-2" id="txtErrorModal"></p>
            </div>
            <div class="modal-footer border-0 bg-light justify-content-center">
                <button type="button" class="btn btn-danger px-5 shadow-sm fw-bold" data-bs-dismiss="modal" th:text="#{boton.entendido}"></button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalExito" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 1rem;">
            <div class="modal-header bg-success border-0 text-white">
                <h5 class="modal-title fw-bold"><i class="bi bi-check-circle-fill me-2"></i><span th:text="#{solicitar.modal.exito.titulo}"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center p-4">
                <i class="bi bi-send-check text-success mb-3" style="font-size: 4rem;"></i>
                <h5 class="fw-bold text-dark" th:text="#{solicitar.modal.exito.subtitulo}"></h5>
                <p class="text-muted mt-2" id="txtExitoModal"></p>
            </div>
            <div class="modal-footer border-0 bg-light justify-content-center">
                <a th:href="@{/pantallas/dashboard}" class="btn btn-success px-5 shadow-sm fw-bold" th:text="#{boton.ir.dashboard}"></a>
            </div>
        </div>
    </div>
</div>

<main class="container px-3 pb-5">
    <div class="card card-flotante p-4 shadow-sm border-0">

        <input type="hidden" id="nominaEmpleado" name="nominaEmpleado" th:value="${empleado != null ? empleado.nomina : ''}">

        <div class="mb-4">
            <label for="tipoConcepto" class="form-label text-dark fw-bold small" th:text="#{solicitar.tipo.solicitud}"></label>
            <div class="input-group">
                <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-grid-fill"></i></span>
                <select class="form-select form-select-lg bg-light border-start-0" id="tipoConcepto" required>
                    <option value="" disabled selected th:text="#{solicitar.cargando.opciones}"></option>
                </select>
            </div>
        </div>

        <div id="seccion-vacaciones" class="seccion-dinamica" style="display:none;">
            <form id="formVacaciones" th:action="@{/pantallas/solicitar-vacaciones}" method="post" autocomplete="off">
                <input type="hidden" name="nominaEmpleado" class="input-nomina-clon">
                <input type="hidden" name="tipoSolicitud" value="VACACIONES_ORDINARIAS">
                <input type="hidden" name="diasSolicitados" id="hiddenDias" value="0">
                <input type="hidden" name="esExtemporanea" id="hiddenExtemporanea" value="false">

                <input type="hidden" id="fechaInicio" name="fechaInicio">
                <input type="hidden" id="fechaFin" name="fechaFin">

                <div id="alertaSaldoNegativo" class="alert alert-danger d-none shadow-sm mb-4">
                    <h5 class="fw-bold text-danger"><i class="bi bi-shield-lock-fill me-2"></i><span th:text="#{solicitar.alerta.restringido.titulo}"></span></h5>
                    <p class="mb-0 small text-dark" th:utext="#{solicitar.alerta.restringido.desc}"></p>
                </div>

                <div class="mb-4 bg-white p-3 border rounded-3 shadow-sm">
                    <label for="rolDescansoId" class="form-label text-dark fw-bold small" th:text="#{solicitar.turno}"></label>
                    <select class="form-select form-select-lg bg-light border-corporativo mb-3" id="rolDescansoId" name="rolDescansoId" required>
                        <option value="" disabled selected th:text="#{solicitar.elige.turno}"></option>
                        <option th:each="rol : ${roles}" th:value="${rol.id}" th:text="${rol.nombreTurno}"></option>
                    </select>

                    <div th:if="${empleado != null and empleado.tipoEmpleado != null and #strings.containsIgnoreCase(empleado.tipoEmpleado, 'SIND')}">
                        <button type="button" class="btn btn-outline-dark w-100 fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalCartelera">
                            <i class="bi bi-calendar2-range-fill me-2"></i> <span th:text="#{solicitar.btn.inspeccionar}"></span>
                        </button>
                        <div class="form-text mt-2 small text-muted"><i class="bi bi-info-circle me-1"></i><span th:text="#{solicitar.recomendacion.lugares}"></span></div>
                    </div>
                </div>

                <div id="contenedorFechasNormales" class="row mb-3 d-none">
                    <div class="col-12 col-md-6 mb-3 mb-md-0">
                        <label for="fechaInicioNormal" class="form-label text-muted fw-bold small" th:text="#{solicitar.fechaInicio}"></label>
                        <input type="date" class="form-control form-control-lg bg-light" id="fechaInicioNormal">
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="fechaFinNormal" class="form-label text-muted fw-bold small" th:text="#{solicitar.fechaFin}"></label>
                        <input type="date" class="form-control form-control-lg bg-light" id="fechaFinNormal">
                    </div>
                </div>

                <div id="contenedorCinepolis" class="row mb-4 d-none" th:if="${empleado != null and empleado.tipoEmpleado != null and #strings.containsIgnoreCase(empleado.tipoEmpleado, 'SIND')}">
                    <div class="col-12">
                        <label class="form-label text-dark fw-bold small"><i class="bi bi-calendar-range text-corporativo me-1"></i><span th:text="#{solicitar.calendario.piso}"></span></label>

                        <div id="mensajeSeleccionaTurno" class="alert alert-secondary border-0 shadow-sm rounded-3 text-center py-4">
                            <i class="bi bi-clock-history fs-3 d-block mb-2 text-muted"></i>
                            <span th:text="#{solicitar.elige.turno.desbloquear}"></span>
                        </div>

                        <div id="loaderCinepolis" class="d-none text-center py-4">
                            <div class="spinner-border text-corporativo" role="status"></div>
                            <p class="text-muted small mt-2 fw-bold" th:text="#{solicitar.cargando.ocupacion}"></p>
                        </div>

                        <div id="boxCalendarioCinepolis" class="d-none bg-white p-3 rounded-4 shadow-sm border d-flex flex-column align-items-center">
                            <input type="text" id="fechaCinepolis" class="d-none">
                            <div class="d-flex justify-content-center flex-wrap gap-3 mt-3 small fw-bold">
                                <span class="text-muted"><i class="bi bi-square-fill text-light border"></i> <span th:text="#{solicitar.leyenda.libre}"></span></span>
                                <span class="text-muted"><i class="bi bi-square-fill text-primary border border-primary"></i> <span th:text="#{solicitar.leyenda.seleccionado}"></span></span>
                                <span class="text-muted"><i class="bi bi-square-fill text-secondary border opacity-25"></i> <span th:text="#{solicitar.leyenda.lleno}"></span></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="alert alert-info d-flex align-items-center mb-3 p-3 border-0 rounded-3 shadow-sm">
                    <i class="bi bi-info-circle-fill fs-4 me-3 text-info"></i>
                    <p class="mb-0 fw-bold text-dark"><span th:text="#{solicitar.dias.descontar}"></span> <span id="lblDias" class="fs-5 ms-1 text-corporativo">0</span></p>
                </div>

                <div id="alertaExtemporanea" class="alert alert-warning d-none small mb-3 shadow-sm" role="alert"></div>

                <div id="alertaSaldoProporcional" class="alert alert-warning d-none small mb-3 p-3 border-0 rounded-3 shadow-sm" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-exclamation-circle-fill text-warning fs-4 me-2"></i>
                        <div>
                            <span class="fw-bold text-dark d-block" th:text="#{solicitar.aviso.balance}"></span>
                            <span th:utext="#{solicitar.aviso.balance.desc}"></span>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="jefeAutorizadorNomina" class="form-label text-muted fw-bold small" th:text="#{solicitar.jefe}"></label>
                    <select class="form-select form-select-lg bg-light" id="jefeAutorizadorNomina" name="jefeAutorizadorNomina">
                        <option value="" disabled selected th:text="#{solicitar.jefe.placeholder}"></option>
                        <option th:each="jefe : ${jefes}" th:value="${jefe.nomina}" th:text="${jefe.nombreCompleto}"></option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="comentarios" class="form-label text-muted fw-bold small" th:text="#{solicitar.comentarios}"></label>
                    <textarea class="form-control bg-light" id="comentarios" name="comentarios" rows="3"></textarea>
                </div>

                <button id="btnEnviarVacaciones" type="submit" class="btn btn-corporativo btn-lg w-100 py-3 shadow-sm d-flex justify-content-center align-items-center gap-2" disabled>
                    <span th:text="#{solicitar.btn.enviar.vacaciones}"></span> <i class="bi bi-send-fill"></i>
                </button>

                <div class="modal fade" id="modalCartelera" tabindex="-1" aria-hidden="true" th:if="${empleado != null and empleado.tipoEmpleado != null and #strings.containsIgnoreCase(empleado.tipoEmpleado, 'SIND')}">
                    <div class="modal-dialog modal-dialog-centered modal-lg">
                        <div class="modal-content border-0 shadow-lg" style="border-radius: 1rem;">
                            <div class="modal-header bg-dark border-0 text-white">
                                <h5 class="modal-title fw-bold"><i class="bi bi-search me-2"></i><span th:text="#{solicitar.cartelera.titulo}"></span></h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body p-4 bg-light">
                                <div class="row">
                                    <div class="col-md-4 border-end">
                                        <label class="form-label text-dark fw-bold small mb-3" th:text="#{solicitar.cartelera.periodo}"></label>

                                        <div class="mb-2">
                                            <label class="text-muted small fw-bold" th:text="#{solicitar.cartelera.desde}"></label>
                                            <input type="date" class="form-control shadow-sm border-0" id="carteleraInicio">
                                        </div>
                                        <div class="mb-4">
                                            <label class="text-muted small fw-bold" th:text="#{solicitar.cartelera.hasta}"></label>
                                            <input type="date" class="form-control shadow-sm border-0" id="carteleraFin">
                                        </div>

                                        <button type="button" id="btnConsultarCartelera" class="btn btn-dark w-100 fw-bold shadow-sm">
                                            <i class="bi bi-cpu me-1"></i> <span th:text="#{solicitar.cartelera.btn.analizar}"></span>
                                        </button>
                                        <p class="text-muted mt-3" style="font-size: 0.70rem; line-height: 1.2;" th:text="#{solicitar.cartelera.nota}"></p>
                                    </div>
                                    <div class="col-md-8">
                                        <div id="loaderCartelera" class="d-none text-center py-5">
                                            <div class="spinner-border text-secondary" role="status"></div>
                                            <p class="text-muted small mt-2 fw-bold" th:text="#{solicitar.cartelera.consultando}"></p>
                                        </div>
                                        <div id="mensajeInicialCartelera" class="text-center py-5 text-muted">
                                            <i class="bi bi-calendar3-range opacity-25" style="font-size: 4rem;"></i>
                                            <p class="mt-2 small fw-bold" th:text="#{solicitar.cartelera.seleccione}"></p>
                                        </div>
                                        <div id="resultadoCartelera" class="d-none bg-white rounded-4 shadow-sm border" style="max-height: 400px; overflow-y: auto;">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <div id="seccion-txt" class="seccion-dinamica" style="display:none;">
            <form id="formTXT" autocomplete="off" onsubmit="event.preventDefault();">

                <div class="alert alert-warning small mb-4 rounded-3 border-0 bg-txt-preview shadow-sm">
                    <i class="bi bi-exclamation-circle-fill me-2 text-warning-dark"></i><span th:text="#{solicitar.txt.regla}"></span>
                </div>

                <div class="p-4 bg-white border shadow-sm rounded-4 mb-4 border-start border-4 border-warning">
                    <h6 class="fw-bold text-dark small mb-4 border-bottom pb-2">
                        <i class="bi bi-stopwatch-fill text-warning me-2 fs-5"></i><span th:text="#{solicitar.txt.titulo}"></span>
                    </h6>

                    <div class="row mb-4">
                        <div class="col-md-4 mb-3 mb-md-0">
                            <label for="txtModalidad" class="form-label text-muted fw-bold small" th:text="#{solicitar.txt.modalidad}"></label>
                            <select class="form-select bg-light shadow-sm fw-bold text-dark border-0" id="txtModalidad">
                                <option value="COMPLETO" selected th:text="#{solicitar.txt.dia.completo}"></option>
                                <option value="PARCIAL" th:text="#{solicitar.txt.por.horas}"></option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3 mb-md-0">
                            <label for="txtFechaFalta" class="form-label text-muted fw-bold small" th:text="#{solicitar.txt.fecha.incidencia}"></label>
                            <input type="date" class="form-control bg-light shadow-sm border-0" id="txtFechaFalta">
                        </div>
                        <div class="col-md-4 d-none" id="divTxtHorasPermiso">
                            <label for="txtHorasPermiso" class="form-label text-muted fw-bold small" th:text="#{solicitar.txt.horas.deber}"></label>
                            <input type="number" class="form-control bg-light shadow-sm border-0 fw-bold text-dark" id="txtHorasPermiso" step="0.5" min="0.5" max="24" th:placeholder="#{js.solicitar.txt.horas.placeholder}">
                        </div>
                    </div>

                    <div class="row mb-4" id="rowTxtTurnoFalta">
                        <div class="col-12">
                            <label for="txtTurnoFalta" class="form-label text-muted fw-bold small" th:text="#{solicitar.txt.turno.falta}"></label>
                            <select class="form-select bg-light shadow-sm fw-bold text-dark border-0" id="txtTurnoFalta">
                                <option value="" disabled selected th:text="#{solicitar.txt.selecciona.turno}"></option>
                                <option th:each="turno : ${listaTurnosMaster}"
                                        th:if="${turno.activo}"
                                        th:value="${turno.nombreTurno}"
                                        th:text="${turno.nombreTurno} + ' (' + ${turno.horasJornada} + ' hrs)'">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label text-dark fw-bold small d-flex justify-content-between align-items-center mb-3">
                            <span><i class="bi bi-calendar2-plus me-1 text-secondary"></i> <span th:text="#{solicitar.txt.desglose}"></span></span>
                            <button type="button" id="btnAgregarPago" class="btn btn-sm btn-dark fw-bold rounded-pill shadow-sm px-3"><i class="bi bi-plus-lg me-1"></i><span th:text="#{solicitar.btn.anadir.dia}"></span></button>
                        </label>
                        <div class="table-responsive">
                            <table class="table table-bordered align-middle bg-white rounded-3 overflow-hidden mb-0" id="tablaPagosTXT">
                                <thead class="table-light">
                                <tr class="small text-muted text-uppercase fw-bold">
                                    <th th:text="#{solicitar.txt.tabla.fecha}"></th>
                                    <th style="width: 140px;" th:text="#{solicitar.txt.tabla.horas}"></th>
                                    <th style="width: 60px;" class="text-center"><i class="bi bi-gear-fill"></i></th>
                                </tr>
                                </thead>
                                <tbody id="tbodyTXT">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="txtJustificacion" class="form-label text-muted fw-bold small" th:text="#{solicitar.txt.justificacion}"></label>
                    <textarea class="form-control bg-white shadow-sm border-0 p-3" id="txtJustificacion" rows="2" th:placeholder="#{solicitar.txt.justificacion.placeholder}"></textarea>
                </div>

                <div class="mb-5">
                    <label for="txtJefeAutorizadorNomina" class="form-label text-muted fw-bold small" th:text="#{solicitar.txt.jefe}"></label>
                    <select class="form-select form-select-lg bg-white shadow-sm border-0 fw-bold" id="txtJefeAutorizadorNomina" required>
                        <option value="" disabled selected th:text="#{solicitar.txt.jefe.placeholder}"></option>
                        <option th:each="jefe : ${jefes}" th:value="${jefe.nomina}" th:text="${jefe.nombreCompleto}"></option>
                    </select>
                </div>

                <button type="button" id="btnEnviarTXT" class="btn btn-dark btn-lg w-100 py-3 shadow-sm rounded-4 d-flex justify-content-center align-items-center gap-2 fw-bold transition-all">
                    <span th:text="#{solicitar.txt.btn.registrar}"></span> <i class="bi bi-stopwatch-fill fs-5"></i>
                </button>
            </form>
        </div>

        <div id="seccion-rangos" class="seccion-dinamica" style="display:none;">
            <form id="formRangos" autocomplete="off" onsubmit="event.preventDefault();">

                <div class="alert alert-info small mb-4 rounded-3 border-0 bg-light shadow-sm">
                    <i class="bi bi-info-circle-fill text-info me-2"></i><span id="txtReglaDinamicaRango" class="fw-bold text-dark"></span>
                </div>

                <div class="p-4 bg-white border shadow-sm rounded-4 mb-4 border-start border-4 border-primary">
                    <h6 class="fw-bold text-dark small mb-4 border-bottom pb-2">
                        <i class="bi bi-calendar-range-fill text-primary me-2 fs-5"></i><span th:text="#{solicitar.rangos.caja1}"></span>
                    </h6>

                    <div class="row mb-4">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="rangoFechaInicio" class="form-label text-muted fw-bold small" th:text="#{solicitar.fechaInicio}"></label>
                            <input type="date" class="form-control form-control-lg bg-light shadow-sm border-0" id="rangoFechaInicio">
                        </div>
                        <div class="col-md-6">
                            <label for="rangoFechaFin" class="form-label text-muted fw-bold small" th:text="#{solicitar.fechaFin}"></label>
                            <input type="date" class="form-control form-control-lg bg-light shadow-sm border-0" id="rangoFechaFin">
                        </div>
                    </div>

                    <div class="alert d-flex align-items-center mb-4 p-3 border-0 rounded-3 shadow-sm bg-primary bg-opacity-10">
                        <i class="bi bi-calculator-fill fs-4 me-3 text-primary"></i>
                        <p class="mb-0 fw-bold text-dark"><span th:text="#{solicitar.rangos.total.habiles}"></span> <span id="lblDiasRango" class="fs-5 ms-1 text-primary">0</span></p>
                    </div>

                    <div class="mb-2">
                        <label for="rangoRolDescansoId" class="form-label text-muted fw-bold small" th:text="#{solicitar.rangos.turno}"></label>
                        <select class="form-select form-select-lg bg-light shadow-sm border-0 fw-bold text-dark" id="rangoRolDescansoId">
                            <option value="" disabled selected th:text="#{solicitar.rangos.turno.placeholder}"></option>
                            <option th:each="rol : ${roles}" th:value="${rol.id}" th:text="${rol.nombreTurno}"></option>
                        </select>
                    </div>
                </div>

                <div class="p-4 bg-white border shadow-sm rounded-4 mb-4 border-start border-4 border-secondary">
                    <h6 class="fw-bold text-dark small mb-4 border-bottom pb-2">
                        <i class="bi bi-shield-lock-fill text-secondary me-2 fs-5"></i><span th:text="#{solicitar.rangos.caja2}"></span>
                    </h6>

                    <div class="mb-4">
                        <label for="rangoJefeAutorizadorNomina" class="form-label text-muted fw-bold small" th:text="#{solicitar.jefe}"></label>
                        <select class="form-select form-select-lg bg-light shadow-sm border-0 fw-bold text-dark" id="rangoJefeAutorizadorNomina">
                            <option value="" disabled selected th:text="#{solicitar.jefe.placeholder}"></option>
                            <option value="NULL" th:text="#{solicitar.rangos.sin.jefe}"></option>
                            <option th:each="jefe : ${jefes}" th:value="${jefe.nomina}" th:text="${jefe.nombreCompleto}"></option>
                        </select>
                    </div>

                    <div class="mb-4" id="contenedorEvidenciaRango">
                        <label for="fileComprobante" class="form-label text-muted fw-bold small"><span th:text="#{solicitar.rangos.evidencia}"></span> <span class="badge bg-danger ms-1 fw-normal" th:text="#{solicitar.rangos.evidencia.badge}"></span></label>
                        <div class="input-group shadow-sm">
                            <span class="input-group-text bg-white border-0"><i class="bi bi-cloud-arrow-up-fill text-muted"></i></span>
                            <input class="form-control form-control-lg bg-light border-0" type="file" id="fileComprobante" accept="image/png, image/jpeg, image/jpg, application/pdf">
                        </div>
                        <div id="helpEvidencia" class="form-text text-danger small d-none fw-bold mt-2"><i class="bi bi-exclamation-triangle-fill me-1"></i><span th:text="#{solicitar.rangos.evidencia.help}"></span></div>
                    </div>

                    <div class="mb-2">
                        <label for="rangoComentarios" class="form-label text-muted fw-bold small" th:text="#{solicitar.rangos.comentarios}"></label>
                        <textarea class="form-control bg-light shadow-sm border-0 p-3" id="rangoComentarios" rows="2" th:placeholder="#{solicitar.rangos.comentarios.placeholder}"></textarea>
                    </div>
                </div>

                <button type="button" id="btnEnviarRangos" class="btn btn-primary btn-lg w-100 py-3 shadow-sm rounded-4 d-flex justify-content-center align-items-center gap-2 fw-bold transition-all" disabled>
                    <span th:text="#{solicitar.rangos.btn.enviar}"></span> <i class="bi bi-send-fill fs-5"></i>
                </button>
            </form>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function() {

        if (document.getElementById("formVacaciones")) document.getElementById("formVacaciones").reset();
        if (document.getElementById("formTXT")) document.getElementById("formTXT").reset();
        if (document.getElementById("formRangos")) document.getElementById("formRangos").reset();
        document.getElementById("tipoConcepto").value = "";

        const msgExito = /*[[${mensajeExito}]]*/ null;
        const msgError = /*[[${mensajeError}]]*/ null;

        if (msgExito) {
            document.getElementById("txtExitoModal").innerText = msgExito;
            new bootstrap.Modal(document.getElementById('modalExito')).show();
        }
        if (msgError) {
            document.getElementById("txtErrorModal").innerText = msgError;
            new bootstrap.Modal(document.getElementById('modalError')).show();
        }

        const inputNominaMaestro = document.getElementById("nominaEmpleado");
        const nominaFinal = parseInt(inputNominaMaestro.value);

        if (!nominaFinal || isNaN(nominaFinal)) {
            document.getElementById("txtErrorModal").innerText = [[#{js.solicitar.error.nomina}]];
            new bootstrap.Modal(document.getElementById('modalError')).show();
            return;
        }

        const saldoDevengado = parseFloat(/*[[${empleado != null && empleado.saldoVacacionesActual != null ? empleado.saldoVacacionesActual : 0}]]*/ '0');
        const saldoProporcional = parseFloat(/*[[${empleado != null && empleado.getSaldoProporcional() != null ? empleado.getSaldoProporcional() : 0}]]*/ '0');
        const tipoEmpleadoStr = /*[[${empleado != null ? empleado.tipoEmpleado : ''}]]*/ '';
        const esSindicalizado = (tipoEmpleadoStr.toUpperCase().includes('SIND'));

        // ✨ NUEVO: Variable global de la guillotina para todos los calendarios
        const limiteHaciaAtras = /*[[${fechaMinimaCaptura}]]*/ 'today';

        // Aplicamos el candado a los inputs de permisos y TXT
        if (document.getElementById("txtFechaFalta")) document.getElementById("txtFechaFalta").setAttribute("min", limiteHaciaAtras);
        if (document.getElementById("rangoFechaInicio")) document.getElementById("rangoFechaInicio").setAttribute("min", limiteHaciaAtras);

        let saldoDevengadoEfectivo = saldoDevengado < 0 ? 0 : saldoDevengado;
        let saldoTotalCalculado = saldoDevengadoEfectivo + saldoProporcional;

        if (esSindicalizado) {
            let parteDecimal = saldoTotalCalculado - Math.floor(saldoTotalCalculado);
            if (parteDecimal >= 0.9) {
                saldoTotalCalculado = Math.ceil(saldoTotalCalculado);
            }
        }
        const saldoTotalDisponible = saldoTotalCalculado;

        document.querySelectorAll(".input-nomina-clon").forEach(input => {
            input.value = nominaFinal;
        });

        if (esSindicalizado) {
            const contEvidencia = document.getElementById("contenedorEvidenciaRango");
            if (contEvidencia) contEvidencia.style.display = 'none';
        }

        let festivosDesdeJava = /*[[${festivos}]]*/ [];
        let feriadosDesdeJava = /*[[${feriadosJson}]]*/ [];
        let horasLimite = parseInt(/*[[${horasAnticipacion}]]*/ '48');
        let catalogoRoles = /*[[${roles}]]*/ [];

        if (!Array.isArray(festivosDesdeJava)) festivosDesdeJava = [];
        if (!Array.isArray(feriadosDesdeJava)) feriadosDesdeJava = [];
        if (!Array.isArray(catalogoRoles)) catalogoRoles = [];
        if (isNaN(horasLimite)) horasLimite = 48;

        let arrayUnido = festivosDesdeJava.concat(feriadosDesdeJava).filter(f => f !== null);

        // 🚨 RESTAURADO: Necesitamos esta lista plana para que el motor matemático sepa qué días no cobrar
        const listaFestivos = arrayUnido.map(f => {
            if (Array.isArray(f) && f.length >= 3) return `${f[0]}-${String(f[1]).padStart(2, '0')}-${String(f[2]).padStart(2, '0')}`;
            if (typeof f === 'object' && f.fecha) {
                if (Array.isArray(f.fecha)) return `${f.fecha[0]}-${String(f.fecha[1]).padStart(2, '0')}-${String(f.fecha[2]).padStart(2, '0')}`;
                return String(f.fecha).substring(0, 10);
            }
            return String(f).replace(/\//g, '-').substring(0, 10);
        });

        // ✨ Diccionario rápido para el Tooltip del Calendario
        const dictFestivos = {};
        festivosDesdeJava.forEach(f => {
            if (typeof f === 'object' && f.fecha && f.descripcion) {
                let fStr = Array.isArray(f.fecha)
                    ? `${f.fecha[0]}-${String(f.fecha[1]).padStart(2, '0')}-${String(f.fecha[2]).padStart(2, '0')}`
                    : String(f.fecha).substring(0, 10);
                dictFestivos[fStr] = f.descripcion;
            }
        });

        const selectConcepto = document.getElementById("tipoConcepto");

        fetch(`/api/permisos/tipos-disponibles?nomina=${nominaFinal}`)
            .then(res => {
                if (!res.ok) throw new Error("No se pudo resolver el catálogo de permisos.");
                return res.json();
            })
            .then(data => {
                selectConcepto.innerHTML = '<option value="" disabled selected>' + [[#{js.solicitar.selecciona.concepto}]] + '</option>';

                // ✨ DICCIONARIO TRADUCTOR EN TIEMPO REAL
                const traduccionesPermisos = {
                    'V': [[#{permiso.v}]],
                    'TXT': [[#{permiso.txt}]],
                    'C': [[#{permiso.c}]],
                    'P': [[#{permiso.p}]],
                    'TET': [[#{permiso.tet}]],
                    'HO': [[#{permiso.ho}]]
                };

                data.forEach(permiso => {
                    let option = document.createElement("option");
                    option.value = permiso.codigo;

                    // Busca la traducción por el código (ej. 'HO'), si no existe, usa la que trae la BD
                    let descripcionFinal = traduccionesPermisos[permiso.codigo] || permiso.descripcion;

                    option.innerText = `${permiso.codigo} - ${descripcionFinal}`;
                    selectConcepto.appendChild(option);
                });
            })
            .catch(err => {
                selectConcepto.innerHTML = '<option value="" disabled>' + [[#{js.solicitar.error.permisos}]] + '</option>';
                console.error(err);
            });

        selectConcepto.addEventListener("change", function() {
            document.querySelectorAll(".seccion-dinamica").forEach(div => div.style.display = "none");

            const valor = selectConcepto.value;
            if (valor === "V") {
                document.getElementById("seccion-vacaciones").style.display = "block";

                // ✨ NUEVO: MODO RESTRINGIDO PARA SALDOS NEGATIVOS
                if (saldoDevengado < 0) {
                    // Mostramos la alerta roja
                    document.getElementById("alertaSaldoNegativo").classList.remove("d-none");
                    // Escondemos los calendarios de abajo
                    document.getElementById("contenedorFechasNormales").classList.add("d-none");
                    document.getElementById("contenedorCinepolis").classList.add("d-none");
                    // Deshabilitamos y escondemos el botón de enviar
                    const btnEnviar = document.getElementById("btnEnviarVacaciones");
                    btnEnviar.disabled = true;
                    btnEnviar.classList.add("d-none");
                } else {
                    // Restauramos en caso de que cambien de opción (aunque no deberían poder tener saldo negativo y luego positivo)
                    document.getElementById("alertaSaldoNegativo").classList.add("d-none");
                    document.getElementById("btnEnviarVacaciones").classList.remove("d-none");
                }

            } else if (valor === "TXT") {
                document.getElementById("seccion-txt").style.display = "block";
                const modTxt = document.getElementById("txtModalidad");
                if(modTxt) {
                    modTxt.value = "COMPLETO";
                    document.getElementById("divTxtHorasPermiso").classList.add("d-none");
                    document.getElementById("rowTxtTurnoFalta").classList.remove("d-none");
                }
            } else {
                document.getElementById("seccion-rangos").style.display = "block";
                document.getElementById("txtReglaDinamicaRango").innerText = [[#{js.solicitar.regla.dinamica}]] + " " + selectConcepto.options[selectConcepto.selectedIndex].text;
                ejecutarCalculoRangos();
            }
            // =========================================================================
            // 🎟️ LÓGICA DEL MÓDULO DE DISPONIBILIDAD (MULTI-DÍA)
            // =========================================================================
            const btnConsultarCartelera = document.getElementById("btnConsultarCartelera");
            const inputInicioCartelera = document.getElementById("carteleraInicio");
            const inputFinCartelera = document.getElementById("carteleraFin");
            const resultadoCartelera = document.getElementById("resultadoCartelera");
            const loaderCartelera = document.getElementById("loaderCartelera");
            const mensajeInicialCartelera = document.getElementById("mensajeInicialCartelera");

            if (btnConsultarCartelera) {
                btnConsultarCartelera.addEventListener("click", function() {
                    const fInicio = inputInicioCartelera.value;
                    const fFin = inputFinCartelera.value;
                    const nominaVal = document.getElementById("nominaEmpleado").value;
                    const turnoSelect = document.getElementById("rolDescansoId");
                    const turnoId = turnoSelect.value;

                    // ✨ REGLA DE ORO: No le mostramos nada si no dice de qué turno es
                    // ✨ REGLA DE ORO
                    if(!turnoId) {
                        alert([[#{js.solicitar.turno.requerido}]]);
                        const myModal = bootstrap.Modal.getInstance(document.getElementById('modalCartelera'));
                        if(myModal) myModal.hide();
                        turnoSelect.focus();
                        return;
                    }

                    if(!fInicio || !fFin) {
                        alert([[#{js.solicitar.fechas.requeridas}]]);
                        return;
                    }

                    const dIni = new Date(fInicio);
                    const dFin = new Date(fFin);
                    if(dFin < dIni) {
                        alert([[#{js.solicitar.fecha.fin.menor}]]);
                        return;
                    }

                    mensajeInicialCartelera.classList.add("d-none");
                    resultadoCartelera.classList.add("d-none");
                    loaderCartelera.classList.remove("d-none");

                    // ✨ ENVIAMOS EL TURNO EN LA URL
                    fetch(`/api/vacaciones/disponibilidad-rango?nominaEmpleado=${nominaVal}&fechaInicio=${fInicio}&fechaFin=${fFin}&turnoId=${turnoId}`)
                        .then(res => res.json())
                        .then(data => {
                            loaderCartelera.classList.add("d-none");
                            resultadoCartelera.classList.remove("d-none");

                            if(data.error) {
                                resultadoCartelera.innerHTML = `<div class="p-4 alert alert-danger small mb-0"><i class="bi bi-x-octagon-fill me-2"></i>${data.error}</div>`;
                                return;
                            }

                            let html = `<div class="list-group list-group-flush rounded-4">`;

                            data.forEach(dia => {
                                let colorCard = "success";
                                let iconCard = "check-circle-fill";
                                let estatusTxt = "DISPONIBLE";

                                if(dia.estatusGlobal !== "DISPONIBLE") {
                                    colorCard = (dia.estatusGlobal === "INHABIL" || dia.estatusGlobal === "BLOQUEADO_VIP") ? "secondary" : "warning";

                                    if (dia.estatusGlobal === "GRUPO_LLENO") iconCard = "exclamation-triangle-fill";
                                    else if (dia.estatusGlobal === "TURNO_LLENO") iconCard = "person-x-fill";
                                    else if (dia.estatusGlobal === "FERIADO") { iconCard = "star-fill"; colorCard = "info"; }
                                    // ✨ BISTURÍ UI: Atrapamos nuestras vacaciones
                                    else if (dia.estatusGlobal === "MI_VACACION") { iconCard = "check2-all"; colorCard = "success"; }
                                    else iconCard = "lock-fill";

                                    estatusTxt = dia.estatusGlobal.replace('_', ' ');
                                }

                                html += `
                                <div class="list-group-item p-3 border-bottom">
                                    <div class="d-flex w-100 justify-content-between align-items-center mb-1">
                                        <h6 class="mb-0 fw-bold text-${colorCard}"><i class="bi bi-${iconCard} me-2"></i>${dia.fechaAfectada}</h6>
                                        <span class="badge bg-${colorCard}">${estatusTxt}</span>
                                    </div>
                                    <p class="mb-2 small text-muted">${dia.mensaje}</p>
                                `;

                                // ✨ PINTAMOS SOLO EL TURNO DEL OPERADOR (Cero "shopping" de turnos)
                                if (dia.turnoData) {
                                    html += `<div class="d-flex flex-wrap gap-2 mt-1">`;
                                    if(dia.turnoData.ocupado) {
                                        html += `<span class="badge bg-danger bg-opacity-10 text-danger border border-danger p-2"><i class="bi bi-person-x-fill me-1"></i>` + [[#{js.solicitar.espacio.ocupado}]] + ` (${dia.turnoData.turnoNombre}): ` + [[#{js.solicitar.estado.ocupado}]] + `</span>`;
                                    } else {
                                        html += `<span class="badge bg-success bg-opacity-10 text-success border border-success p-2"><i class="bi bi-person-check-fill me-1"></i>` + [[#{js.solicitar.espacio.ocupado}]] + ` (${dia.turnoData.turnoNombre}): ` + [[#{js.solicitar.estado.libre}]] + `</span>`;
                                    }
                                    html += `</div>`;
                                }

                                // Detalle de la ocupación del Grupo
                                if (dia.ocupadosGrupo !== undefined && dia.cupoMaximo !== undefined && dia.cupoMaximo !== 999) {
                                     html += `<div class="small fw-bold text-dark bg-light p-2 rounded border mt-2"><i class="bi bi-diagram-3 me-2 text-secondary"></i>` + [[#{js.solicitar.ocupacion.global}]] + ` ${dia.ocupadosGrupo} / ${dia.cupoMaximo} ` + [[#{js.solicitar.lugares}]] + ` (${dia.grupoNombre})</div>`;
                                }

                                html += `</div>`;
                            });

                            html += `</div>`;
                            resultadoCartelera.innerHTML = html;
                        })
                        .catch(err => {
                            console.error(err);
                            loaderCartelera.classList.add("d-none");
                            resultadoCartelera.classList.remove("d-none");
                            resultadoCartelera.innerHTML = `<div class="p-4 alert alert-danger small mb-0"><i class="bi bi-wifi-off me-2"></i>` + [[#{js.solicitar.error.conexion}]] + `</div>`;
                        });
                });
            }
        });

        const txtModalidad = document.getElementById("txtModalidad");
        const divTxtHorasPermiso = document.getElementById("divTxtHorasPermiso");
        const rowTxtTurnoFalta = document.getElementById("rowTxtTurnoFalta");
        const inputHorasPermiso = document.getElementById("txtHorasPermiso");

        if (txtModalidad) {
            txtModalidad.addEventListener("change", function() {
                if (this.value === "PARCIAL") {
                    divTxtHorasPermiso.classList.remove("d-none");
                    if (rowTxtTurnoFalta) rowTxtTurnoFalta.classList.add("d-none");
                    inputHorasPermiso.setAttribute("required", "required");
                } else {
                    divTxtHorasPermiso.classList.add("d-none");
                    if (rowTxtTurnoFalta) rowTxtTurnoFalta.classList.remove("d-none");
                    inputHorasPermiso.removeAttribute("required");
                    inputHorasPermiso.value = "";
                }
            });
        }

        // =========================================================================
        // 🍿 MOTOR DE INTERFAZ: CINÉPOLIS (SINDICALIZADO) vs NORMAL (ADMIN)
        // =========================================================================
        const fInicio = document.getElementById("fechaInicio");
        const fFin = document.getElementById("fechaFin");
        const selRol = document.getElementById("rolDescansoId");
        const lblResultado = document.getElementById("lblDias");
        const btnSubmitVacaciones = document.getElementById("btnEnviarVacaciones");
        const divExtemporanea = document.getElementById("alertaExtemporanea");
        const alertaProporcional = document.getElementById("alertaSaldoProporcional");

        let cinepolisCalendar;

        if (esSindicalizado) {
            // Activar UI Cinépolis para Operadores
            document.getElementById("contenedorCinepolis").classList.remove("d-none");

            selRol.addEventListener("change", function() {
                const turnoId = this.value;
                const nomina = document.getElementById("nominaEmpleado").value;

                fInicio.value = "";
                fFin.value = "";
                ejecutarCalculoVacaciones();

                document.getElementById("mensajeSeleccionaTurno").classList.add("d-none");
                document.getElementById("boxCalendarioCinepolis").classList.add("d-none");
                document.getElementById("loaderCinepolis").classList.remove("d-none");

                // Llamar al API del backend que programamos
                fetch(`/api/vacaciones/dias-bloqueados?nominaEmpleado=${nomina}&turnoId=${turnoId}`)
                    .then(res => res.json())
                    .then(diasBloqueados => {
                        document.getElementById("loaderCinepolis").classList.add("d-none");
                        document.getElementById("boxCalendarioCinepolis").classList.remove("d-none");

                        // ✨ AVISO DE SEMANA VIP Ajustado
                        if(diasBloqueados.length > 60) {
                            document.getElementById("mensajeSeleccionaTurno").classList.remove("d-none");
                            document.getElementById("mensajeSeleccionaTurno").classList.replace("alert-secondary", "alert-warning");
                            document.getElementById("mensajeSeleccionaTurno").innerHTML = `
                                <i class="bi bi-unlock-fill fs-3 d-block mb-2 text-warning"></i>
                                <strong>` + [[#{js.solicitar.mes.disponible}]] + `</strong><br>
                                ` + [[#{js.solicitar.mes.disponible.desc}]] + `
                            `;
                        }


                        if (cinepolisCalendar) cinepolisCalendar.destroy();

                        cinepolisCalendar = flatpickr("#fechaCinepolis", {
                            mode: "range",
                            dateFormat: "Y-m-d",
                            minDate: limiteHaciaAtras,
                            disable: diasBloqueados, // El array de casillas grises que mandó Java
                            inline: true,
                            locale: "es",
                            // ✨ MAGIA: Pintamos el festivo y le ponemos su Tooltip al vuelo
                            onDayCreate: function(dObj, dStr, fp, dayElem) {
                                // Usamos fp.formatDate para que siempre sea exacto "Y-m-d" local
                                const fechaKey = fp.formatDate(dayElem.dateObj, "Y-m-d");

                                if (dictFestivos[fechaKey]) {
                                    dayElem.classList.add("dia-festivo-flatpickr");
                                    dayElem.title = dictFestivos[fechaKey];
                                }
                            },
                            onChange: function(selectedDates, dateStr, instance) {
                                if (selectedDates.length === 2) {
                                    fInicio.value = instance.formatDate(selectedDates[0], "Y-m-d");
                                    fFin.value = instance.formatDate(selectedDates[1], "Y-m-d");
                                    ejecutarCalculoVacaciones();
                                } else {
                                    fInicio.value = "";
                                    fFin.value = "";
                                    ejecutarCalculoVacaciones();
                                }
                            }
                        });
                    })
                    .catch(err => {
                        console.error("Error cargando bloqueos: ", err);
                        document.getElementById("loaderCinepolis").classList.add("d-none");
                        alert("Error al cargar la disponibilidad de línea. Intente más tarde.");
                    });
            });

        } else {
            // 🧑‍💼 Activar UI Normal para Administrativos (Flujo Libre)
            document.getElementById("contenedorFechasNormales").classList.remove("d-none");

            const fInicioNormal = document.getElementById("fechaInicioNormal");
            const fFinNormal = document.getElementById("fechaFinNormal");

            // Sincronizar las cajas de texto visibles con los inputs ocultos del formulario
            fInicioNormal.addEventListener("change", function() {
                fInicio.value = this.value;
                ejecutarCalculoVacaciones();
            });
            fFinNormal.addEventListener("change", function() {
                fFin.value = this.value;
                ejecutarCalculoVacaciones();
            });

            selRol.addEventListener("change", ejecutarCalculoVacaciones);
        }

        function ejecutarCalculoVacaciones() {
            // (El resto de la función ejecutarCalculoVacaciones que ya tenías se queda exactamente igual)
            if (!fInicio.value || !fFin.value || !selRol.value) {
                lblResultado.innerText = "0";
                if(alertaProporcional) alertaProporcional.classList.add("d-none");
                btnSubmitVacaciones.disabled = true;
                return;
            }

            const dateI = new Date(fInicio.value + "T00:00:00");
            const dateF = new Date(fFin.value + "T00:00:00");
            const ahora = new Date();

            if (dateF < dateI) {
                lblResultado.innerText = [[#{js.solicitar.rango.error}]];
                if(alertaProporcional) alertaProporcional.classList.add("d-none");
                btnSubmitVacaciones.disabled = true;
                return;
            }

            const rolActivo = catalogoRoles.find(r => r.id == selRol.value);
            if (!rolActivo) return;

            const mapaDias = ["DOMINGO", "LUNES", "MARTES", "MIERCOLES", "JUEVES", "VIERNES", "SABADO"];
            const descansosSaneados = (rolActivo.diasDescanso || "DOMINGO").toUpperCase()
                .replace(/Á/g, "A").replace(/É/g, "E").replace(/Í/g, "I").replace(/Ó/g, "O").replace(/Ú/g, "U")
                .replace(/\s+/g, "");

            let contadorFinal = 0;
            let cursor = new Date(dateI);

            while (cursor <= dateF) {
                let diaSemNum = cursor.getDay();
                let diaNombreTexto = mapaDias[diaSemNum];

                let y = cursor.getFullYear();
                let m = String(cursor.getMonth() + 1).padStart(2, '0');
                let d = String(cursor.getDate()).padStart(2, '0');
                let fechaTexto = `${y}-${m}-${d}`;

                if (!descansosSaneados.includes(diaNombreTexto) && !listaFestivos.includes(fechaTexto)) {
                    contadorFinal++;
                }
                cursor.setDate(cursor.getDate() + 1);
            }

            lblResultado.innerText = contadorFinal;
            document.getElementById("hiddenDias").value = contadorFinal;

            if (alertaProporcional) {
                if (contadorFinal > 0 && (saldoDevengado <= 0 || contadorFinal > saldoDevengado)) {
                    alertaProporcional.classList.remove("d-none");
                } else {
                    alertaProporcional.classList.add("d-none");
                }
            }

            if (contadorFinal > saldoTotalDisponible) {
                lblResultado.classList.add("text-danger");
            } else {
                lblResultado.classList.remove("text-danger");
            }

            const diffH = (dateI.getTime() - ahora.getTime()) / (1000 * 60 * 60);
            const esExt = diffH < horasLimite;
            document.getElementById("hiddenExtemporanea").value = esExt;

            if (esExt) {
                divExtemporanea.classList.remove("d-none");
                divExtemporanea.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i>' + [[#{js.solicitar.extemporanea}]];
            } else {
                divExtemporanea.classList.add("d-none");
            }

            btnSubmitVacaciones.disabled = (contadorFinal === 0);
        }

        let aceptoComercial = false;
        const formVacaciones = document.getElementById("formVacaciones");

        formVacaciones.addEventListener("submit", function(e) {
            const diasPedidos = parseInt(document.getElementById("hiddenDias").value) || 0;

            if (diasPedidos > saldoTotalDisponible) {
                e.preventDefault();
                document.getElementById("txtErrorModal").innerText = [[#{js.solicitar.rechazado.contable.1}]] + " " + diasPedidos + " " + [[#{js.solicitar.rechazado.contable.2}]] + " " + saldoTotalDisponible + " " + [[#{js.solicitar.rechazado.contable.3}]];
                new bootstrap.Modal(document.getElementById('modalError')).show();
                return;
            }

            const esExt = document.getElementById("hiddenExtemporanea").value === "true";
            if (esExt && !aceptoComercial) {
                e.preventDefault();
                new bootstrap.Modal(document.getElementById('modalComercial')).show();
            } else {
                btnSubmitVacaciones.disabled = true;
                btnSubmitVacaciones.innerHTML = '<span>' + [[#{js.solicitar.procesando}]] + '</span> <div class="spinner-border spinner-border-sm" role="status"></div>';
            }
        });

        document.getElementById("btnAceptarComercial").addEventListener("click", function() {
            aceptoComercial = true;
            this.disabled = true;
            this.innerHTML = [[#{js.solicitar.enviando}]];
            btnSubmitVacaciones.disabled = true;
            btnSubmitVacaciones.innerHTML = '<span>' + [[#{js.solicitar.procesando.simple}]] + '</span> <div class="spinner-border spinner-border-sm" role="status"></div>';
            formVacaciones.submit();
        });

        // ==========================================================
        // OTRAS LÓGICAS (Permisos TXT y Rangos Dinámicos)
        // ==========================================================
        const tbodyTXT = document.getElementById("tbodyTXT");
        const btnAgregarPago = document.getElementById("btnAgregarPago");

        function crearFilaPagoTXT() {
            const rowCount = tbodyTXT.children.length;
            if (rowCount >= 2) {
                document.getElementById("txtErrorModal").innerText = [[#{js.solicitar.txt.limite}]];
                new bootstrap.Modal(document.getElementById('modalError')).show();
                return;
            }

            let tr = document.createElement("tr");
            tr.innerHTML = `
                <td><input type="date" class="form-control form-control-sm input-txt-fecha-pago" min="${limiteHaciaAtras}" required></td>
                <td><input type="number" class="form-control form-control-sm input-txt-horas-pago" step="0.1" min="0.5" max="24" placeholder="${[[#{js.solicitar.txt.horas.placeholder}]]}" required></td>
                <td class="text-center"><button type="button" class="btn btn-sm btn-link text-danger btn-eliminar-pago"><i class="bi bi-trash3-fill"></i></button></td>
            `;

            tr.querySelector(".btn-eliminar-pago").addEventListener("click", function() {
                tr.remove();
                if (tbodyTXT.children.length === 0) {
                    crearFilaPagoTXT();
                }
            });

            tbodyTXT.appendChild(tr);
        }

        btnAgregarPago.addEventListener("click", crearFilaPagoTXT);
        crearFilaPagoTXT();

        const rInicio = document.getElementById("rangoFechaInicio");
        const rFin = document.getElementById("rangoFechaFin");
        const rRol = document.getElementById("rangoRolDescansoId");
        const rJefe = document.getElementById("rangoJefeAutorizadorNomina");
        const rFile = document.getElementById("fileComprobante");
        const lblDiasRango = document.getElementById("lblDiasRango");
        const btnEnviarRangos = document.getElementById("btnEnviarRangos");
        const helpEvidencia = document.getElementById("helpEvidencia");
        const contEvidencia = document.getElementById("contenedorEvidenciaRango");

        function ejecutarCalculoRangos() {
            if (esSindicalizado) {
                if (contEvidencia) contEvidencia.classList.add("d-none");
                helpEvidencia.classList.add("d-none");
            } else {
                let requiereEvidencia = (rJefe.value === "NULL" || rJefe.value === "");
                if (requiereEvidencia) {
                    if (contEvidencia) contEvidencia.classList.remove("d-none");
                    helpEvidencia.classList.remove("d-none");
                } else {
                    if (contEvidencia) contEvidencia.classList.add("d-none");
                    helpEvidencia.classList.add("d-none");
                }
            }

            if (!rInicio.value || !rFin.value || !rRol.value) {
                lblDiasRango.innerText = "0";
                btnEnviarRangos.disabled = true;
                return;
            }

            const dateI = new Date(rInicio.value + "T00:00:00");
            const dateF = new Date(rFin.value + "T00:00:00");

            if (dateF < dateI) {
                lblDiasRango.innerText = [[#{js.solicitar.rango.error}]];
                btnEnviarRangos.disabled = true;
                return;
            }

            const rolActivo = catalogoRoles.find(r => r.id == rRol.value);
            if (!rolActivo) return;

            const mapaDias = ["DOMINGO", "LUNES", "MARTES", "MIERCOLES", "JUEVES", "VIERNES", "SABADO"];
            const descansosSaneadosRango = (rolActivo.diasDescanso || "DOMINGO").toUpperCase()
                .replace(/Á/g, "A").replace(/É/g, "E").replace(/Í/g, "I").replace(/Ó/g, "O").replace(/Ú/g, "U")
                .replace(/\s+/g, "");

            let contadorHabiles = 0;
            let cursor = new Date(dateI);

            while (cursor <= dateF) {
                let diaSemNum = cursor.getDay();
                let diaNombreTexto = mapaDias[diaSemNum];
                let y = cursor.getFullYear();
                let m = String(cursor.getMonth() + 1).padStart(2, '0');
                let d = String(cursor.getDate()).padStart(2, '0');
                let fechaTexto = `${y}-${m}-${d}`;

                if (!descansosSaneadosRango.includes(diaNombreTexto) && !listaFestivos.includes(fechaTexto)) {
                    contadorHabiles++;
                }
                cursor.setDate(cursor.getDate() + 1);
            }

            lblDiasRango.innerText = contadorHabiles;

            let formValido = (contadorHabiles > 0);

            if (!esSindicalizado) {
                let sinJefeSeleccionado = (rJefe.value === "");
                let jefeNullManual = (rJefe.value === "NULL");

                if (jefeNullManual || sinJefeSeleccionado) {
                    if (!rFile || !rFile.files || rFile.files.length === 0) {
                        formValido = false;
                    }
                }
            }

            btnEnviarRangos.disabled = !formValido;
        }

        if (rFile) {
            rFile.addEventListener("change", function() {
                if (rFile.files.length > 0) {
                    const pesoArchivo = rFile.files[0].size / 1024 / 1024;
                    if (pesoArchivo > 2) {
                        document.getElementById("txtErrorModal").innerText = "El archivo excede el límite de 2MB.";
                        new bootstrap.Modal(document.getElementById('modalError')).show();
                        rFile.value = "";
                    }
                }
                ejecutarCalculoRangos();
            });
        }

        rInicio.addEventListener("change", ejecutarCalculoRangos);
        rFin.addEventListener("change", ejecutarCalculoRangos);
        rRol.addEventListener("change", ejecutarCalculoRangos);
        rJefe.addEventListener("change", ejecutarCalculoRangos);

        document.getElementById("btnEnviarTXT").addEventListener("click", function() {
            const fechaFalta = document.getElementById("txtFechaFalta").value;
            const justif = document.getElementById("txtJustificacion").value;
            const turnoFalta = document.getElementById("txtTurnoFalta").value;
            const jefeTXT = document.getElementById("txtJefeAutorizadorNomina").value;
            const esPorHoras = document.getElementById("txtModalidad").value === "PARCIAL";
            const horasPermisoInput = document.getElementById("txtHorasPermiso").value;

            if (!fechaFalta) {
                document.getElementById("txtErrorModal").innerText = "Por favor especifica la fecha en la que ocurrió o se programará la falta.";
                new bootstrap.Modal(document.getElementById('modalError')).show();
                return;
            }

            if (!esPorHoras && !turnoFalta) {
                document.getElementById("txtErrorModal").innerText = "Por favor selecciona el turno correspondiente a la falta.";
                new bootstrap.Modal(document.getElementById('modalError')).show();
                return;
            }

            if (!jefeTXT) {
                document.getElementById("txtErrorModal").innerText = "Por favor selecciona al jefe que autorizará tu Tiempo por Tiempo.";
                new bootstrap.Modal(document.getElementById('modalError')).show();
                return;
            }

            let desgloses = [];
            let inputsFecha = tbodyTXT.querySelectorAll(".input-txt-fecha-pago");
            let inputsHoras = tbodyTXT.querySelectorAll(".input-txt-horas-pago");
            let validacionInputs = true;
            let contieneDomingo = false;

            for (let i = 0; i < inputsFecha.length; i++) {
                if (!inputsFecha[i].value || !inputsHoras[i].value) {
                    validacionInputs = false;
                    break;
                }

                if (esPorHoras) {
                    const partesFecha = inputsFecha[i].value.split('-');
                    const dateCheck = new Date(parseInt(partesFecha[0]), parseInt(partesFecha[1]) - 1, parseInt(partesFecha[2]));
                    if (dateCheck.getDay() === 0) {
                        contieneDomingo = true;
                    }
                }

                desgloses.push({
                    fechaPago: inputsFecha[i].value,
                    horasPago: parseFloat(inputsHoras[i].value)
                });
            }

            if (!validacionInputs || desgloses.length === 0) {
                document.getElementById("txtErrorModal").innerText = "Debes completar las fechas y horas en el desglose de pagos.";
                new bootstrap.Modal(document.getElementById('modalError')).show();
                return;
            }

            if (contieneDomingo) {
                document.getElementById("txtErrorModal").innerText = "Restricción de Pre-nómina: No está permitido programar reposiciones parciales de horas los días domingo.";
                new bootstrap.Modal(document.getElementById('modalError')).show();
                return;
            }

            if (esPorHoras && (!horasPermisoInput || parseFloat(horasPermisoInput) <= 0)) {
                document.getElementById("txtErrorModal").innerText = "Por favor especifica la cantidad de horas del permiso parcial.";
                new bootstrap.Modal(document.getElementById('modalError')).show();
                return;
            }

            const payload = {
                empleadoNomina: nominaFinal,
                codigoPermiso: "TXT",
                fechaIncidencia: fechaFalta,
                justificacionSupervisor: justif,
                nombreTurno: esPorHoras ? null : turnoFalta,
                jefeAutorizadorNomina: parseInt(jefeTXT),
                desglosesPago: desgloses,
                esPorHoras: esPorHoras,
                horasPermiso: esPorHoras ? parseFloat(horasPermisoInput) : 0
            };

            dispararFetchPermiso(payload);
        });

        document.getElementById("btnEnviarRangos").addEventListener("click", function() {
            const btn = this;
            const fechaI = rInicio.value;
            const fechaF = rFin.value;
            const jefeSeleccionado = rJefe.value;

            if (!fechaI || !fechaF) {
                document.getElementById("txtErrorModal").innerText = "Debe capturar el rango completo (Inicio y Fin) para el permiso.";
                new bootstrap.Modal(document.getElementById('modalError')).show();
                return;
            }

            const textoOriginal = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span>Transmitiendo...</span> <div class="spinner-border spinner-border-sm" role="status"></div>';

            const formData = new FormData();
            formData.append("empleadoNomina", nominaFinal);
            formData.append("codigoPermiso", selectConcepto.value);
            formData.append("fechaInicio", fechaI);
            formData.append("fechaFin", fechaF);
            formData.append("rolDescansoId", rRol.value);
            formData.append("comentarios", document.getElementById("rangoComentarios").value || "");

            if (jefeSeleccionado && jefeSeleccionado !== "NULL" && jefeSeleccionado !== "") {
                formData.append("jefeAutorizadorNomina", jefeSeleccionado);
            }

            if (!esSindicalizado && rFile && rFile.files.length > 0) {
                formData.append("comprobante", rFile.files[0]);
            }

            fetch('/api/permisos/solicitar-rango', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "SUCCESS") {
                    document.getElementById("txtExitoModal").innerText = data.message;
                    new bootstrap.Modal(document.getElementById('modalExito')).show();
                    if (document.getElementById("formRangos")) document.getElementById("formRangos").reset();
                } else {
                    document.getElementById("txtErrorModal").innerText = data.message;
                    new bootstrap.Modal(document.getElementById('modalError')).show();
                    btn.disabled = false;
                    btn.innerHTML = textoOriginal;
                }
            })
            .catch(err => {
                document.getElementById("txtErrorModal").innerText = "Fallo de comunicación contable al inyectar el rango.";
                new bootstrap.Modal(document.getElementById('modalError')).show();
                console.error(err);
                btn.disabled = false;
                btn.innerHTML = textoOriginal;
            });
        });

        function dispararFetchPermiso(payload) {
            const btnTXT = document.getElementById("btnEnviarTXT");
            const textoOriginalTXT = btnTXT.innerHTML;

            btnTXT.disabled = true;
            btnTXT.innerHTML = '<span>Guardando en Servidor...</span> <div class="spinner-border spinner-border-sm" role="status"></div>';

            fetch('/api/permisos/solicitar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "SUCCESS") {
                    document.getElementById("txtExitoModal").innerText = data.message;
                    new bootstrap.Modal(document.getElementById('modalExito')).show();
                    if (document.getElementById("formTXT")) document.getElementById("formTXT").reset();
                } else {
                    document.getElementById("txtErrorModal").innerText = data.message;
                    new bootstrap.Modal(document.getElementById('modalError')).show();
                    btnTXT.disabled = false;
                    btnTXT.innerHTML = textoOriginalTXT;
                }
            })
            .catch(err => {
                document.getElementById("txtErrorModal").innerText = "Fallo de comunicación contable con el servidor de planta.";
                new bootstrap.Modal(document.getElementById('modalError')).show();
                console.error(err);
                btnTXT.disabled = false;
                btnTXT.innerHTML = textoOriginalTXT;
            });
        }
    });
</script>

</body>
</html>
